name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          python3 scripts/package-agent.py \
            --binary target/aarch64-apple-darwin/release/wx-cli \
            --version '${{ github.ref_name }}' \
            --output 'wx-cli-agent-${{ github.ref_name }}-macos-arm64.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wx-cli-agent-${{ github.ref_name }}-macos-arm64.tar.gz
            wx-cli-agent-${{ github.ref_name }}-macos-arm64.tar.gz.sha256
          draft: true
          overwrite_files: false
          make_latest: false
          body: ${{ steps.changelog.outputs.body }}
