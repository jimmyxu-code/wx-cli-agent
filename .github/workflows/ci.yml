name: CI

on:
  push:
    branches: [main, agent-read-macos]
  pull_request:
    branches: [main, agent-read-macos]

env:
  CARGO_TERM_COLOR: always

jobs:
  native-fixtures:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Offline native ABI and Unix socket fixtures
        working-directory: experimental/native_send/native_413
        run: |
          wx_native_fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$wx_native_fixture_dir"' EXIT
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer test_core.cpp -o "$wx_native_fixture_dir/test-core"
          "$wx_native_fixture_dir/test-core"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer test_rpc_fixture.cpp -o "$wx_native_fixture_dir/test-rpc"
          WX_NATIVE_RPC_FIXTURE="$wx_native_fixture_dir/test-rpc" python3 test_rpc_client.py
          PYTHONPATH="$(xcrun lldb -P)" /usr/bin/python3 -m unittest discover -s . -p 'test_sender_guard.py'
  bridge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sh agent_bridge/test.sh

  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
